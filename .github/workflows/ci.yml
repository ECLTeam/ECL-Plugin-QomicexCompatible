name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Ruff Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.10
      - name: Ruff check
        run: ruff check .
      - name: Ruff format
        run: ruff format --check .

  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # 插件 main.py 运行期由宿主提供 ECL.plugins.api；
      # 独立 CI 用宿主仓库源码以 PYTHONPATH 提供同一 SDK。
      - uses: actions/checkout@v4
        with:
          repository: ECLTeam/EuoraCraft-Launcher
          ref: main
          path: host
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pydantic
      - name: Run tests
        run: python -m pytest --tb=short
        env:
          PYTHONPATH: ${{ github.workspace }}/host
